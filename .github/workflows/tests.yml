name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}, Guzzle ${{ matrix.guzzle }}, ${{ matrix.dependencies }} deps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.4", "8.5"]
        guzzle: ["^7.0", "^8.0"]
        dependencies: ["stable", "lowest"]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-stable ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }} --with "guzzlehttp/guzzle:${{ matrix.guzzle }}"

      - name: Show installed Guzzle
        run: composer show guzzlehttp/guzzle

      - name: Run PHPUnit
        run: vendor/bin/phpunit ./test
